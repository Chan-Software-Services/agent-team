# The code's checks on GitHub: on every pull request to dev (and to main, a release's promotion),
# on each trial commit the merge queue builds (merge_group), and by hand. They are the gate of a PR
# to dev: its protection and projects.toml's required_checks for agent-team require each job by its
# id (shellcheck, test, toolkits, rust, data, zizmor), so renaming a job changes a required check,
# and team-merge merges only with every one passed on the PR's head, as the queue lands a trial commit
# only with every one passed on it; test passes only when every shard of test-shards did, so a
# shard job is never a required check itself, nor is shard-plan, whose timings every shard splits by.
# The shards split the bats files by each file's seconds in the latest successful CI run, which
# shard-plan reads through the Actions API (tests/shards update --to) and hands every shard as the
# timings artifact, which each names by TESTS_TIMINGS beside the committed tests/timings.tsv, so
# the split never goes stale; when it cannot read a run it warns once and hands on the committed
# tests/timings.tsv. The artifact is kept 30 days, GitHub's window for rerunning a job, so a
# rerun shard splits by the file its run's others did. It is the one job whose token reads the
# Actions runs (actions: read); every other job's reads the contents alone.
# A newer run cancels an older one of the same event and ref, a pull request's (its
# refs/pull/<n>/merge) or a branch's dispatched one, never a run of another event, which
# team-ci-run may be waiting on, and never a merge queue's trial commit. Every curl this file runs
# itself retries a transient failure (curl --retry); the toolkits job's downloads by tools.lock's
# own commands do not.
# Each job has a time limit (timeout-minutes), about twice its longest recent run, so a hang ends
# long before GitHub's 6-hour default; each that runs bats has one above tests/run's file limit
# (TESTS_FILE_MINUTES), so tests/run names a hung file before the job is stopped.
# Every job runs on Linux: CI runs no macOS job, so no PR waits on GitHub's macOS runners. The
# toolkits job runs the toolkits' servers over stdio against a throwaway MongoDB in Docker, and the
# rust toolkit's hooks on the pinned toolchain's cargo. The rust job checks the Cargo workspace
# (tests/run rust) only when a change reaches a Rust path, on a pull request and a trial commit,
# passing at once otherwise, and whole by hand. The data job refuses what the PR adds that the
# public repository never takes: a secret (gitleaks, over its commits) and a real email address or
# an image (bin/lib/data-check code, over what it adds), naming paths and kinds, never a value. The
# zizmor job audits the workflows offline and fails on any finding, each accepted one ignored on
# its own line with its audit and reason.
name: CI

on:
  pull_request:
    branches: [dev, main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          archive=shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz
          curl --retry 5 --retry-all-errors -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$archive"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive"
          echo "$PWD/shellcheck-$SHELLCHECK_VERSION" >>"$GITHUB_PATH"
      - run: tests/run shellcheck

  # The timings the shards split by: each bats file's seconds in the latest successful CI run,
  # else the committed tests/timings.tsv, with one warning naming why.
  shard-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the checkout
      actions: read # the latest successful run's shard jobs and their logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the latest successful run's timings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir timings
          if ! timeout 180 tests/shards update --to timings/timings.tsv 2>update.err; then
            cat update.err
            echo "::warning::the shards split by the committed tests/timings.tsv: $(tail -n 1 update.err)"
            cp tests/timings.tsv timings/timings.tsv
          fi
          head -n 1 timings/timings.tsv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings
          path: timings/timings.tsv
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # The bats suite in three shards (tests/run bats --shard), each on a runner of its own, all
  # split by shard-plan's timings (TESTS_TIMINGS), the committed tests/timings.tsv left in place
  # for tests/repo.bats to check.
  test-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: shard-plan
    strategy:
      fail-fast: false
      matrix: {shard: [1, 2, 3]}
    env:
      SHARD: ${{ matrix.shard }}
      JQ_VERSION: 1.8.1
      JQ_SHA256: 020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own jq is 1.7.1, older than any team machine's; bin/lib/tools.lock's floor is
      # the version installed here, which tests/repo.bats holds.
      - name: Install jq ${{ env.JQ_VERSION }}
        run: |
          mkdir jq-bin
          curl --retry 5 --retry-all-errors -fsSLo jq-bin/jq "https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSION/jq-linux-amd64"
          echo "$JQ_SHA256  jq-bin/jq" | sha256sum -c -
          chmod +x jq-bin/jq
          echo "$PWD/jq-bin" >>"$GITHUB_PATH"
      - run: jq --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: timings
          path: ${{ runner.temp }}/timings
      - name: Split by shard-plan's timings
        run: |
          echo "TESTS_TIMINGS=$RUNNER_TEMP/timings/timings.tsv" >>"$GITHUB_ENV"
          head -n 1 "$RUNNER_TEMP/timings/timings.tsv"
      - run: tests/run bats --shard "$SHARD/3"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: test-shards
    if: always()
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.test-shards.result }}
        run: '[[ $RESULT == success ]]'

  # The toolkits' servers over stdio, against a throwaway MongoDB in Docker.
  toolkits:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JQ_VERSION: 1.8.1
      JQ_SHA256: 020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d
      RUST_TOOLKIT_TESTS: require
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      # The runner's own jq is 1.7.1, older than any team machine's; the toolkits' hooks and the
      # ui-check skill run jq filters, so this job installs the jq test-shards does.
      - name: Install jq ${{ env.JQ_VERSION }}
        run: |
          mkdir jq-bin
          curl --retry 5 --retry-all-errors -fsSLo jq-bin/jq "https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSION/jq-linux-amd64"
          echo "$JQ_SHA256  jq-bin/jq" | sha256sum -c -
          chmod +x jq-bin/jq
          echo "$PWD/jq-bin" >>"$GITHUB_PATH"
      - run: jq --version
      # MongoDB 8.0 starts or exits by the kernel's version (tests/toolkits/helpers/mongo.mjs).
      - name: Show the kernel
        run: uname -r
      # Every tool bin/lib/tools.lock installs from a publisher's archive (MongoDB's Database Tools),
      # by the lock's own commands for this runner, each archive checked against its SHA-256.
      - name: Install the lock's downloaded tools
        run: |
          mapfile -t fixes < <(jq -L bin/lib -r --arg os arch --arg machine x86_64 'include "tools"; download_sources($os; $machine)' bin/lib/tools.lock)
          ((${#fixes[@]}))
          for fix in "${fixes[@]}"; do bash -c "$fix" || exit 1; done
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      # The toolchain rust-toolchain.toml pins, so the rust toolkit's real-cargo cases run here,
      # which RUST_TOOLKIT_TESTS makes fail instead of skipping.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          cargo --version
      - run: tests/run toolkits

  # The Cargo workspace, by tests/run rust's six steps (fmt, clippy, nextest, doc tests, cargo-deny,
  # the policy's refusal of tests/fixtures/rust-deny). On a pull request and on a merge queue's trial
  # commit it checks only a change that reaches a Rust path since the base, the one the data job
  # reads its range from, and otherwise passes at once, so the required check reports on every PR
  # and a new advisory fails only a PR that touches Rust; by hand it checks the whole workspace.
  # No sccache and no cache action: the skeleton builds in seconds; add one when the job passes 5
  # minutes.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_NEXTEST_VERSION: 0.9.152
      CARGO_NEXTEST_SHA256: 521c5f790ed07ee69d0a88403d9d86a8c8ab27977f12fc73f22aa4e7e14a0f71
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Each archive and tool outside the checkout, so tests/run rust --changed sees none of them
      # among the working tree's changes.
      - name: Install cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/rust-bin"
          archive=$RUNNER_TEMP/cargo-nextest-$CARGO_NEXTEST_VERSION-x86_64-unknown-linux-musl.tar.gz
          curl --retry 5 --retry-all-errors -fsSLo "$archive" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$CARGO_NEXTEST_VERSION/${archive##*/}"
          echo "$CARGO_NEXTEST_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/rust-bin" cargo-nextest
      - name: Install cargo-deny ${{ env.CARGO_DENY_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/rust-bin"
          archive=$RUNNER_TEMP/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz
          curl --retry 5 --retry-all-errors -fsSLo "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/${archive##*/}"
          echo "$CARGO_DENY_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/rust-bin" --strip-components=1 "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
          echo "$RUNNER_TEMP/rust-bin" >>"$GITHUB_PATH"
      # The runner's own Rust is older: this reads rust-toolchain.toml and downloads its toolchain.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          cargo --version
      - name: Name the base
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          echo "RUST_BASE=${BASE_SHA:-$QUEUE_BASE_SHA}" >>"$GITHUB_ENV"
          [[ -n ${BASE_SHA:-$QUEUE_BASE_SHA} ]]
      - name: Check what the change reaches
        if: github.event_name != 'workflow_dispatch'
        run: tests/run rust --changed "$RUST_BASE"
      - name: Check the whole workspace
        if: github.event_name == 'workflow_dispatch'
        run: tests/run rust

  # What the PR adds: no secret in its commits, no real email address, no image and no
  # node_modules/ path in its files.
  # On a merge queue's trial commit, what it adds to the commit the queue built it on.
  # By hand, what the ref adds since origin/dev.
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl --retry 5 --retry-all-errors -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          mkdir gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$PWD/gitleaks-bin" >>"$GITHUB_PATH"
      - name: Name the range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          echo "PR_BASE=${BASE_SHA:-${QUEUE_BASE_SHA:-origin/dev}}" >>"$GITHUB_ENV"
          echo "PR_HEAD=${HEAD_SHA:-${QUEUE_HEAD_SHA:-HEAD}}" >>"$GITHUB_ENV"
      - name: No secret in the commits
        run: gitleaks git --no-banner --redact=100 --verbose --log-opts="$PR_BASE..$PR_HEAD" .
      - name: No real email address, image or package tree in what the PR adds
        run: bin/lib/data-check code "$PR_BASE" "$PR_HEAD"

  # The repository's workflows and any action or Dependabot config, offline, so it needs no token.
  # zizmor-online.yml runs the same zizmor online, never required: bump the pin in both.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: 1.31.1
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor ${{ env.ZIZMOR_VERSION }}
        run: |
          archive=zizmor-x86_64-unknown-linux-gnu.tar.gz
          curl --retry 5 --retry-all-errors -fsSLO "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/$archive"
          echo "$ZIZMOR_SHA256  $archive" | sha256sum -c -
          mkdir zizmor-bin
          tar -xzf "$archive" -C zizmor-bin zizmor
          echo "$PWD/zizmor-bin" >>"$GITHUB_PATH"
      - run: zizmor --offline .
