# Dependabot's version updates, and the titles of its security updates too.
# Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Its PRs target the default branch, dev, and merge like any other PR: on every required check
# passed on their head, the agent review's included.
version: 2
updates:
  - package-ecosystem: "npm"
    # The MCP servers, clients and packages the sessions and the toolkits' tests run, which
    # servers/package-lock.json pins and servers/install installs.
    directory: "/servers"
    schedule:
      interval: "weekly"
    # A new release waits a week before Dependabot proposes it, so a bad one has time to be pulled
    # before CI runs it. Security updates are not delayed: GitHub applies no cooldown to them.
    cooldown:
      default-days: 7
    # Titles are Conventional Commits: fix(deps): for what servers/package.json lists under
    # dependencies, which today is every package, tooling included, and chore(deps-dev): for what
    # it lists under devDependencies.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # A week's minor and patch bumps arrive as one PR per dependency type, so CI runs once for each;
    # with no devDependencies today, that is the one fix(deps): PR. A major bump comes on its own.
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    # The workflows in .github/workflows/.
    directory: "/"
    schedule:
      interval: "weekly"
    # The same week's wait as npm's, for the same reason.
    cooldown:
      default-days: 7
    # ci(deps): an action bump changes CI, not what the sessions run.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        update-types: ["minor", "patch"]
